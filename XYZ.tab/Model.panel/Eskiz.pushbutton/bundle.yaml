title:
  ru: Эскиз
  en_us: "Fabrication\nSketch"
tooltip:
  ru: |-
    Эскиз нестандартного изделия по ЕСКД в легенде — из параметров семейства (пленумы кнопки «Пленум»).
    Виды: главный (грань и поворот на выбор), слева, сверху, справа, снизу, сзади; аксонометрия под любым ракурсом (видовой куб, как в Revit).
    Размеры, диаметры, отверстия (заливка и стрелки), технические требования.
    Легенда на каждый типоразмер — линиями, как превью, размеры Revit. Превью — в окне. Отмена — Ctrl+Z.
  en_us: Draws a fabrication sketch of a family (views, axonometry, Revit dimensions, openings, notes) in a legend view, from the family's parameters.
author: db
version: 1.0.0
icon: icon.png
