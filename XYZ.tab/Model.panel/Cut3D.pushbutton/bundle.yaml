title:
  ru: Подрезать 3D
  en_us: Crop 3D
tooltip:
  ru: Рамка 3D-вида сверху и снизу — по уровням со смещением, как «Секущий диапазон» плана. Активный и выбранные в диспетчере 3D-виды отмечены сами, можно отметить ещё. Границы в плане — как у рамки сейчас или по модели. «Считать с вида» подбирает уровни по текущей рамке. Отмена — Ctrl+Z.
  en_us: Sets the top and bottom of a 3D view section box by levels with offsets, like a view range.
author: db
version: 1.0.0
icon: icon.png
