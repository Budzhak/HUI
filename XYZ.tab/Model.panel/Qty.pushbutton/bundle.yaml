title:
  ru: Количество
  en_us: Quantities
tooltip:
  ru: |-
    Количество с запасом в ADSK_Количество / ADSK_Размер_Площадь — по правилам, которые вы видите и правите.
    1) Где: выделенное / вид / модель, рабочие наборы, здание по областям видимости.
    2) Правила: категория + условие → как считать → куда писать → запас, %.
    3) Проба: было → станет. Пока не нажато «Применить», модель не меняется. Отмена — Ctrl+Z.
  en_us: Calculates quantities with allowances by rules (category + condition → how to count → allowance), with a before/after preview.
author: db
version: 1.0.0
