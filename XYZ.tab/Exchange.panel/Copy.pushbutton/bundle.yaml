title:
  ru: "Под\nкопирку"
  en_us: "Copy\nFormat"
tooltip:
  ru: |-
    Оформление активной ведомости — на другие ведомости с теми же графами: ширина и порядок граф, заголовки и их выравнивание, шрифты и стиль ячеек, заголовок ведомости, группы заголовков, типы текста. По флажкам — сортировка и группирование, итоги граф, фильтры (значения фильтров по той же графе у каждой ведомости остаются свои). Данные не меняются. Отмена — Ctrl+Z.
    Shift+щелчок — вписать ширины всех граф активной ведомости (мм).
  en_us: 'Copies the formatting of a schedule to other schedules with the same columns. Shift+click: column widths only.'
author: db
version: 1.0.0
icon: icon.png
