title:
  ru: "По\nпорядку"
  en_us: "Renumber\nSheets"
tooltip:
  ru: 'Перенумеровать листы по порядку в списке. Листы сгруппированы по папкам диспетчера проекта (текущая организация): можно взять одну группу или все, каждую с начала. Префикс, начальный номер, шаг, длина, суффикс; «Вверх/Вниз» и сортировка меняют порядок. Предпросмотр «Было → Станет», конфликты подсвечиваются; занятый номер можно сдвинуть пробелом в конце.'
  en_us: Renumbers sheets in order within Project Browser groups, with a preview.
author: db
version: 1.0.0
description: Перенумерация листов
