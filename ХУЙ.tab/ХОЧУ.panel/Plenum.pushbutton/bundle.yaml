title:
  ru: Пленум
  en_us: Plenum
tooltip:
  ru: Пленум (камера статического давления) с врезками → семейство «Арматура воздуховодов» с соединителями. Размеры, режим приточный/вытяжной, врезки круглые и прямоугольные на любой грани; проверка, что всё влезает и не пересекается. Параметры ADSK из ФОП2021(КС), врезки — параметры семейства db_В*. Одинаковая конфигурация не создаёт дубль семейства.
  en_us: Creates a plenum box family with branch connections.
author: db
