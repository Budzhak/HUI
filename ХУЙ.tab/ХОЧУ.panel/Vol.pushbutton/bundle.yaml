title: Объёмы
tooltip: |-
  Объёмы пространств и раскраска — цвет задаётся фильтрами вида.
  1) Пространства: выделенные / на виде / все.
  2) Объёмы: создать или обновить (форма + значения параметров), удалить свои, удалить сторонние объёмы с частями.
  3) Раскраска вида: параметр → цвета значений, прозрачность → «Покрасить». Перед каждым действием — проба. Отмена — Ctrl+Z.
