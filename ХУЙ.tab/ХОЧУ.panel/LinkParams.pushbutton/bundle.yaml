title: "Беспорядочные\nсвязи"
tooltip: "Переносит общие параметры связи (IFC или RVT) в проект с тем же GUID и категориями, чтобы по ним можно было настраивать фильтры видимости (IfcPresentationLayer, ArchiCADProperties.* и т. п.). Отмечаешь только нужные параметры и категории, видишь итог до добавления; добавленное можно убрать этой же кнопкой. По желанию печатает значения параметров в связи. Shift+клик — диагностика связи без изменений."
author: "db"
version: "0.1.0"
icon: "icon.png"
