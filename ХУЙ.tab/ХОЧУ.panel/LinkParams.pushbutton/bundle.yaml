title:
  ru: "Беспорядочные\nсвязи"
  en_us: "Link\nParameters"
tooltip:
  ru: Переносит общие параметры связи (IFC или RVT) в проект с тем же GUID и категориями, чтобы по ним можно было настраивать фильтры видимости (IfcPresentationLayer, ArchiCADProperties.* и т. п.). Отмечаешь только нужные параметры и категории, видишь итог до добавления; добавленное можно убрать этой же кнопкой. По желанию печатает значения параметров в связи. Shift+клик — диагностика связи без изменений.
  en_us: Adds shared parameters of an IFC/RVT link to the project, so that view filters can use them. Values stay in the link.
author: db
version: 0.1.0
icon: icon.png
