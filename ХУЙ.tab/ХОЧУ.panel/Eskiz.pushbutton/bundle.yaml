title: Эскиз
tooltip: |-
  Эскиз нестандартного изделия по ЕСКД в легенде — из параметров семейства (пленумы кнопки «Пленум»).
  Виды: главный (грань и поворот на выбор), слева, сверху, справа, снизу, сзади; аксонометрия с азимутом и наклоном.
  Размеры, диаметры, отверстия (заливка и стрелки), технические требования.
  Легенда на каждый типоразмер или одна сводная. Превью — в окне. Отмена — Ctrl+Z.
