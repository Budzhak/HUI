title: "Равнение"
tooltip: >-
  Выравнивание труб, воздуховодов, лотков и фитингов.
  В меню три команды: «Выровнять» — по оси опорного элемента;
  «Выровнять по высоте» — сдвиг только по Z до пересечения с осью опорного;
  «Выровнять вертикально» — верх стояка ровно над низом.
  Команды работают по кругу до Esc, каждый шаг отменяется Ctrl+Z.
author: db + Claude
