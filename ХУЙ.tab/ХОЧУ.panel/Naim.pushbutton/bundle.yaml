title:
  ru: Наименования
  en_us: Naming
tooltip:
  ru: |-
    ADSK_Наименование по шаблонам, которые вы видите и правите; там же — db_Раздел и ключ сортировки.
    1) Где: выделенное / вид / модель, рабочие наборы, здание по областям видимости.
    2) Правила: категория + условие → шаблон {Параметр | модификатор}; таблицы (толщина стали); разделы.
    3) Проба: было → станет. Пока не нажато «Применить», модель не меняется. Отмена — Ctrl+Z.
  en_us: Fills ADSK_Наименование, section and sort key from rule templates (category + condition → name), with a before/after preview.
author: db
version: 1.0.0
