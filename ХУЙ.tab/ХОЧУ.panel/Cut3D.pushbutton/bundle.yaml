title: Подрезать 3D
tooltip: Рамка 3D-вида сверху и снизу — по уровням со смещением, как «Секущий диапазон» плана. Активный и выбранные в диспетчере 3D-виды отмечены сами, можно отметить ещё. Границы в плане — как у рамки сейчас или по модели. «Считать с вида» подбирает уровни по текущей рамке. Отмена — Ctrl+Z.
