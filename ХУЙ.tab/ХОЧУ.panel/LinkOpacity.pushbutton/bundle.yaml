title: "Прозрачные\nсвязи"
tooltip: Слайдер 0–100 % — прозрачность связанных моделей в активном виде (работает и в «Скрытых линиях»). Скрипт читает категории элементов связи и ставит фильтр db_Связи_Прозрачность; db_ОВ2_Непрозрачно по именам типов ОВ2 держит твою модель непрозрачной. 0 — фильтры снимаются, 100 — связь скрыта.
