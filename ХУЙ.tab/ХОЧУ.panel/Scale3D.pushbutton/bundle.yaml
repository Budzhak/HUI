title: "Масштаб\n3D"
tooltip: |-
  Дописывает масштаб «( 1 : N)» в «Заголовок на листе» 3D-видов, но только у видовых экранов типа «Заголовок на листе_3D_Масштаб». Остальные 3D-виды не трогает. Повторный запуск обновляет масштаб. Shift+клик — выбрать типы вручную.
