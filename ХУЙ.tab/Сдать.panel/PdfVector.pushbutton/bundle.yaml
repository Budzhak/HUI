title: "PDF\nвектор"
tooltip: "Листы в лёгкий векторный PDF. На время экспорта (с откатом) выключает у видов то, из-за чего Revit превращает лист в картинку (тонировка → «Одноцветный», тени, «Глубина», фон, прозрачность модели), выгружает листы, а потом в фоне облегчает PDF: убирает повторные и закрытые линии и заливки, лишнюю точность, склеивает в один файл. Модель не меняется."
author: "db"
version: "1.0.0"
icon: "icon.png"
