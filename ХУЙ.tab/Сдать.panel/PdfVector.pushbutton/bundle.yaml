title:
  ru: "PDF\nвектор"
  en_us: "Vector\nPDF"
tooltip:
  ru: 'Листы в лёгкий векторный PDF. На время экспорта (с откатом) выключает у видов то, из-за чего Revit превращает лист в картинку (тонировка → «Одноцветный», тени, «Глубина», фон, прозрачность модели), выгружает листы, а потом в фоне облегчает PDF: убирает повторные и закрытые линии и заливки, лишнюю точность, склеивает в один файл. Модель не меняется.'
  en_us: Exports sheets to lightweight vector PDF (no raster), optionally optimised with an external Python 3.
author: db
