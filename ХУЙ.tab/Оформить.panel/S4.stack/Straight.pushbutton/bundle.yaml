title:
  ru: "Прямая\nвыноска"
  en_us: "Straight\nLeader"
tooltip:
  ru: 'Щёлкните марку, затем точку, где ей стоять: выноска станет прямой — сверху, снизу, слева или справа (по тому, куда вы щёлкнули от нынешнего конца выноски), конец выноски сам сдвинется вдоль оси трубы. Не проходит — другое направление, иначе излом. По кругу, Esc — выход; каждая марка — свой Ctrl+Z. Работает с любыми марками; выделенные заранее марки идут первыми.'
  en_us: 'Click a tag, then where it should go: the leader becomes straight and its end slides along the pipe.'
author: db
version: 1.0.0
icon: icon.png
