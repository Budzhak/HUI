title: "Участки\nфреона"
tooltip: "Участки фреонопровода (жидкостная линия) на активной 3D-схеме: номер, размер трубы, отводы, перепад высот, длина с изгибами отводов (вверх до 0,1 м). Столбцы: размер жидк. и газ, отводы, перепад, длина — по жидкостной линии. Номера — от наружного блока, у разветвителя — номера примыкающих участков через «-», через комплект ЭРВ — N.1 / N.2. Пишет параметры db_Участок_* и создаёт спецификацию «db_Участки_<система>»."
author: db
version: 1.0.0
icon: icon.png
