title: Посмотреть
tooltip: |-
  Выгрузка спецификации в Excel для правки (версия 3).
  Вкладки: копия ведомости один в один; «Как на виде» — правьте здесь (номера граф, счётчик правок и пояснения под таблицей); «ElementId» — эталон по элементам без формул.
  Белые — экземпляр, жёлтые — тип, оранжевые и серые — нельзя. Обратно — кнопкой «Забрать».
author: db
version: 3.0.0
description: Экспорт спецификации Revit в Excel (вкладка «Как на виде»)
