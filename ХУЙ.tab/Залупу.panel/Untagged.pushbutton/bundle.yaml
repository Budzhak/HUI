title:
  ru: "Безымянная\nхуйня"
  en_us: "Untagged\nRuns"
tooltip:
  ru: Участки труб без марки на активном виде (участок — труба одного диаметра от точки подключения до точки подключения). Окно со списком; «Показать» выделяет весь участок и приближает к нему, «◀ / ▶» — соседний участок. Модель и графику вида не меняет — только выделение.
  en_us: Lists pipe runs without a tag on the view; 'Show' selects and zooms to the run.
