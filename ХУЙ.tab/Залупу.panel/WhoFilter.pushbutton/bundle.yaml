title: "Идентификация\nфильтра"
tooltip: Какие фильтры активного вида действуют на выбранный элемент (в том числе элемент связи), их правила и графика. Фильтр можно сразу выключить, скрыть/показать его элементы и настроить графику (линии, штриховки, прозрачность, полутон) — «Применить» меняет вид, не закрывая окно.
