title: "Зафильтровать\nтип элемента"
tooltip: Выделите элементы и нажмите — для каждого типоразмера создаётся фильтр видимости «db_<Категория>_Тип꞉ <Тип>» (правила — имя типа и имя семейства) и сразу добавляется на текущий вид, затем открывается окно «Идентификация фильтра». Если у элемента нет типа (например, из IFC) — выбираете параметр с данными (IfcName и т. п.), фильтр «db_<Категория>_<Параметр>꞉ <Значение>»; параметр связи, которого нет в проекте, добавляется в проект. Если фильтр уже есть — используется он. Shift+клик — без открытия окна.
